<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Bilim Müşavirlik Gönderi</title>
<link rel="stylesheet" href="set.css">
<style>
  /* Akışta tek bakışta okunan afiş: başlık, yüz, telefon */
  body { width: 1080px; height: 1350px; background: var(--navy); }

  .logo { left: 80px; top: 72px; width: 640px; }

  h1 { left: 80px; top: 272px; width: 920px; font-size: 112px; line-height: .98; color: var(--on); }

  .photo { left: 520px; top: 576px; width: 560px; height: 774px; object-position: 50% 12%; }

  .who { left: 80px; top: 612px; width: 380px; }
  .who p { font-size: 21px; line-height: 1.5; color: var(--on-soft); }
  .who p b { color: var(--on); font-weight: 500; }

  .sign { left: 80px; top: 980px; width: 380px; border-top: 1px solid var(--rule-on); padding-top: 20px; }
  .sign b { display: block; font-family: "Spectral", serif; font-weight: 400; font-size: 26px; color: var(--on); }
  .sign span { display: block; font-size: 16px; color: var(--on-soft); margin-top: 4px; }

  .tel { left: 80px; top: 1164px; font-family: "Spectral", serif; font-size: 44px; letter-spacing: .01em; color: var(--on); }
  .tel small { display: block; font-family: "Albert Sans", sans-serif; font-size: 16px; letter-spacing: 0; color: var(--on-soft); margin-top: 4px; }
</style>
</head>
<body>
  <img class="abs logo" src="../logo/bilim-logo-beyaz.svg" alt="Bilim Müşavirlik, Kasım Çapraz SMMM A.Ş.">

  <h1 class="abs display">Alışkanlıkla değil, yöntemle yönetin.</h1>

  <img class="abs photo" src="../post/foto-b.jpg" alt="Kasım Çapraz">

  <div class="abs who">
    <p>1973’ten bu yana Bursa’da KOBİ’lere ve aile şirketlerine <b>mali müşavirlik ve kurumsal danışmanlık</b> veriyoruz.</p>
  </div>

  <div class="abs sign">
    <b>Kasım Çapraz</b>
    <span>Serbest Muhasebeci Mali Müşavir</span>
  </div>

  <div class="abs tel">0224 453 52 00<small>bilim@bilimmusavirlik.com.tr</small></div>
</body>
</html>
