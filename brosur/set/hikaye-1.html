<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Bilim Müşavirlik Hikâye 1</title>
<link rel="stylesheet" href="set.css">
<style>
  /* Hikâye güvenli alanı: üstte ve altta ~250px arayüz payı */
  body { width: 1080px; height: 1920px; background: var(--navy); }
  .logo { left: 90px; top: 250px; width: 420px; }
  h1 { left: 90px; top: 430px; width: 900px; font-size: 120px; line-height: .98; color: var(--on); }
  .sign { left: 90px; top: 880px; width: 900px; border-top: 1px solid var(--rule-on); padding-top: 24px; }
  .sign b { display: block; font-family: "Spectral", serif; font-weight: 400; font-size: 36px; color: var(--on); }
  .sign span { display: block; font-size: 24px; color: var(--on-soft); margin-top: 6px; }
  .photo { left: 0; top: 1080px; width: 1080px; height: 840px; object-position: 50% 12%; }
</style>
</head>
<body>
  <img class="abs logo" src="../bilim-logo-beyaz-hd.png" alt="Bilim Müşavirlik, Kasım Çapraz SMMM A.Ş.">
  <h1 class="abs display">Alışkanlıkla değil, yöntemle yönetin.</h1>
  <div class="abs sign">
    <b>Kasım Çapraz</b>
    <span>Serbest Muhasebeci Mali Müşavir, 1973’ten bu yana Bursa’da</span>
  </div>
  <img class="abs photo" src="../kasim-capraz.jpg" alt="Kasım Çapraz">
</body>
</html>
